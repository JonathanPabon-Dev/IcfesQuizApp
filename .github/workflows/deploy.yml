# 📈 Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # 🕘 Runs at 9:00 AM every Monday and Thursday
  schedule:
    - cron: "0 0 * * 1,4"

  # ⚙️ Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # 🔄 Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# 🔒 Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# ⏱️ Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}

jobs:
  # 💼 Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v6
      - name: ⚡️ Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - name: ⚡️ Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
      - name: 🛠️ Build
        run: pnpm run build
      - name: 📄 Setup Pages
        uses: actions/configure-pages@v6
      - name: 📂 Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload dist folder
          path: "./dist"
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  keep-supabase-active:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
    steps:
      - name: Make a request to Supabase
        run: |
          curl -X GET "$VITE_SUPABASE_URL/rest/v1/quizzes" \
          -H "Authorization: Bearer $VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY" \
          -H "Content-Type: application/json"
